<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img"
     aria-label="Metis architecture: unified backend, UI, and user">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa39a"/>
    </marker>
  </defs>

  <style>
    .box-outer { fill: #fcfcfa; stroke: #2c4a1a; stroke-width: 2.5; }
    .box-ui    { fill: #fcfcfa; stroke: #5d7d28; stroke-width: 2; }
    .icon      { fill: none; stroke: #5d7d28; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .icon-fill { fill: #5d7d28; stroke: none; }
    .label     { font: 600 17px -apple-system, "Segoe UI", sans-serif; fill: #333; text-anchor: middle; }
    .title     { font: 700 22px -apple-system, "Segoe UI", sans-serif; fill: #2c4a1a; text-anchor: middle; }
    .ui-pill   { fill: #f0f0e8; stroke: #d8d8d2; stroke-width: 1; }
    .ui-text   { font: 600 15px -apple-system, "Segoe UI", sans-serif; fill: #333; text-anchor: middle; }
    .arrow     { fill: none; stroke: #9aa39a; stroke-width: 2; }
    .researcher-stroke { fill: #fcfcfa; stroke: #2c4a1a; stroke-width: 2.5; stroke-linejoin: round; }
  </style>

  <!-- Top: unified Metis backend box -->
  <rect class="box-outer" x="40" y="20" width="820" height="220" rx="16"/>
  <text class="title" x="450" y="56">Back-End</text>

  <!-- Icon: PubMed corpus -->
  <g transform="translate(150, 145)">
    <ellipse class="icon" cx="0" cy="-18" rx="24" ry="7"/>
    <path    class="icon" d="M -24 -18 L -24 14 Q -24 21 0 21 Q 24 21 24 14 L 24 -18"/>
    <ellipse class="icon" cx="0" cy="-2" rx="24" ry="6"/>
    <ellipse class="icon" cx="0" cy="14" rx="24" ry="6"/>
    <text class="label" y="56">PubMed corpus</text>
  </g>

  <!-- Icon: LLM agent -->
  <g transform="translate(350, 145)">
    <path class="icon" d="M -26 -18 L 22 -18 Q 28 -18 28 -12 L 28 6 Q 28 12 22 12 L -8 12 L -18 22 L -18 12 Q -26 12 -26 6 L -26 -12 Q -26 -18 -26 -18 Z"/>
    <circle class="icon-fill" cx="-12" cy="-3" r="2.4"/>
    <circle class="icon-fill" cx="0"   cy="-3" r="2.4"/>
    <circle class="icon-fill" cx="12"  cy="-3" r="2.4"/>
    <text class="label" y="56">LLM agent</text>
  </g>

  <!-- Icon: Automated reviewer (clipboard with check) -->
  <g transform="translate(550, 145)">
    <rect class="icon" x="-20" y="-22" width="40" height="46" rx="3"/>
    <rect class="icon" x="-9"  y="-27" width="18" height="8"  rx="1"/>
    <line class="icon" x1="-12" y1="-8" x2="6"  y2="-8"/>
    <polyline class="icon" points="-10,4 -3,11 12,-5"/>
    <line class="icon" x1="-12" y1="14" x2="12" y2="14"/>
    <text class="label" y="56">Automated reviewer</text>
  </g>

  <!-- Icon: Institution papers (stack with column) -->
  <g transform="translate(750, 145)">
    <!-- Building columns -->
    <line class="icon" x1="-22" y1="22" x2="22" y2="22"/>
    <line class="icon" x1="-18" y1="22" x2="-18" y2="-4"/>
    <line class="icon" x1="-6"  y1="22" x2="-6"  y2="-4"/>
    <line class="icon" x1="6"   y1="22" x2="6"   y2="-4"/>
    <line class="icon" x1="18"  y1="22" x2="18"  y2="-4"/>
    <line class="icon" x1="-22" y1="-4" x2="22" y2="-4"/>
    <polygon class="icon" points="-24,-4 24,-4 0,-22"/>
    <text class="label" y="56">Institution papers</text>
  </g>

  <!-- Bidirectional arrow: backend ↔ UI -->
  <line class="arrow" x1="450" y1="248" x2="450" y2="296"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- UI box -->
  <rect class="box-ui" x="200" y="300" width="500" height="120" rx="10"/>
  <text class="title" x="450" y="332" font-size="20">UI</text>
  <rect class="ui-pill" x="220" y="350" width="140" height="56" rx="6"/>
  <rect class="ui-pill" x="380" y="350" width="140" height="56" rx="6"/>
  <rect class="ui-pill" x="540" y="350" width="140" height="56" rx="6"/>
  <text class="ui-text" x="290" y="384">chat</text>
  <text class="ui-text" x="450" y="384">filters</text>
  <text class="ui-text" x="610" y="384">graph</text>

  <!-- Bidirectional arrow: UI ↔ user -->
  <line class="arrow" x1="450" y1="426" x2="450" y2="478"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- User icon -->
  <g transform="translate(450, 540)">
    <circle class="researcher-stroke" cx="0" cy="-22" r="22"/>
    <path   class="researcher-stroke" d="M -36 28 Q -36 -8 0 -8 Q 36 -8 36 28 Z"/>
    <text class="label" y="62">User</text>
  </g>
</svg>
