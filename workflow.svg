<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" role="img"
     aria-label="Researcher connected by arrows to five separate tools">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa39a"/>
    </marker>
  </defs>

  <style>
    .node-box   { fill: #fcfcfa; stroke: #d8d8d2; stroke-width: 1.5; }
    .node-label { font: 600 18px -apple-system, "Segoe UI", sans-serif; fill: #333; }
    .icon       { fill: none; stroke: #5d7d28; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .researcher-stroke { fill: #fcfcfa; stroke: #2c4a1a; stroke-width: 2.5; stroke-linejoin: round; }
    .researcher-label  { font: 700 22px -apple-system, "Segoe UI", sans-serif; fill: #2c4a1a; }
    .arrow      { fill: none; stroke: #9aa39a; stroke-width: 1.6; }
  </style>

  <!-- Connector arrows (researcher → each tool) -->
  <g class="arrow" marker-end="url(#arrow)">
    <path d="M 200 165 C 540 165, 880 35,  1170 35"/>
    <path d="M 200 165 C 540 165, 880 100, 1170 100"/>
    <path d="M 200 165 L 1170 165"/>
    <path d="M 200 165 C 540 165, 880 230, 1170 230"/>
    <path d="M 200 165 C 540 165, 880 295, 1170 295"/>
  </g>

  <!-- Researcher -->
  <g transform="translate(130, 165)">
    <circle class="researcher-stroke" cx="0" cy="-44" r="24"/>
    <path class="researcher-stroke" d="M -40 28 Q -40 -18 0 -18 Q 40 -18 40 28 Z"/>
    <text class="researcher-label" x="0" y="62" text-anchor="middle">Researcher</text>
  </g>

  <!-- Tool: Folder of papers -->
  <g transform="translate(1290, 35)">
    <rect class="node-box" x="-120" y="-26" width="240" height="52" rx="8"/>
    <g class="icon" transform="translate(-92, 0)">
      <path d="M -14 -11 L -3 -11 L 1 -15 L 14 -15 L 14 11 L -14 11 Z"/>
      <line x1="-9" y1="-3" x2="10" y2="-3"/>
      <line x1="-9" y1="3"  x2="10" y2="3"/>
    </g>
    <text class="node-label" x="-65" y="6">Folder of papers</text>
  </g>

  <!-- Tool: LLM agent -->
  <g transform="translate(1290, 100)">
    <rect class="node-box" x="-120" y="-26" width="240" height="52" rx="8"/>
    <g class="icon" transform="translate(-92, 0)">
      <path d="M -16 -10 L 14 -10 Q 18 -10 18 -6 L 18 6 Q 18 10 14 10 L -6 10 L -14 16 L -14 10 Q -18 10 -18 6 L -18 -6 Q -18 -10 -16 -10 Z"/>
      <circle cx="-8" cy="0" r="1.6" fill="#5d7d28" stroke="none"/>
      <circle cx="0"  cy="0" r="1.6" fill="#5d7d28" stroke="none"/>
      <circle cx="8"  cy="0" r="1.6" fill="#5d7d28" stroke="none"/>
    </g>
    <text class="node-label" x="-65" y="6">LLM agent</text>
  </g>

  <!-- Tool: Hand review -->
  <g transform="translate(1290, 165)">
    <rect class="node-box" x="-120" y="-26" width="240" height="52" rx="8"/>
    <g class="icon" transform="translate(-92, 0)">
      <rect x="-14" y="-13" width="20" height="24" rx="2"/>
      <line x1="-10" y1="-7" x2="2" y2="-7"/>
      <line x1="-10" y1="-1" x2="2" y2="-1"/>
      <circle cx="8" cy="6" r="6"/>
      <line x1="12" y1="10" x2="16" y2="14"/>
    </g>
    <text class="node-label" x="-65" y="6">Hand review</text>
  </g>

  <!-- Tool: ASReview -->
  <g transform="translate(1290, 230)">
    <rect class="node-box" x="-120" y="-26" width="240" height="52" rx="8"/>
    <g class="icon" transform="translate(-92, 0)">
      <rect x="-14" y="-13" width="22" height="24" rx="2"/>
      <polyline points="-9,-3 -4,2 4,-7"/>
      <line x1="-9" y1="6" x2="2" y2="6"/>
    </g>
    <text class="node-label" x="-65" y="6">ASReview</text>
  </g>

  <!-- Tool: PubMed -->
  <g transform="translate(1290, 295)">
    <rect class="node-box" x="-120" y="-26" width="240" height="52" rx="8"/>
    <g class="icon" transform="translate(-92, 0)">
      <ellipse cx="0" cy="-10" rx="13" ry="4"/>
      <path d="M -13 -10 L -13 10 Q -13 14 0 14 Q 13 14 13 10 L 13 -10"/>
      <ellipse cx="0" cy="0" rx="13" ry="4"/>
    </g>
    <text class="node-label" x="-65" y="6">PubMed</text>
  </g>
</svg>
